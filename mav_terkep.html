<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>MÁV elemek — 120a és 82 vonal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-locatecontrol/0.79.0/L.Control.Locate.min.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; font-size: 16px; }
  #map { width: 100%; height: 100vh; }
  #status {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: white; padding: 8px 14px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4); font-size: 16px;
    max-width: 60vw;
  }
  #loader {
    position: absolute; top: 54px; left: 50px; z-index: 1000;
    background: white; padding: 8px 12px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4); font-size: 13px;
  }
  .mav-icon {
    border-radius: 50%; border: 2px solid white;
    box-shadow: 0 0 3px rgba(0,0,0,0.6);
  }
  .mav-icon.diamond {
    border-radius: 2px; transform: rotate(45deg);
  }
  .mav-icon.cross {
    border-radius: 3px;
  }
  .popup-table { font-size: 15px; border-collapse: collapse; }
  .popup-table td { padding: 3px 8px 3px 0; vertical-align: top; }
  .popup-table td:first-child { color: #555; white-space: nowrap; }

  /* --- Térképi címkék (permanens tooltip-ek) --- */
  .mav-label {
    background: rgba(255,255,255,0.92);
    border: none; box-shadow: 0 0 2px rgba(0,0,0,0.5);
    padding: 2px 6px; font-size: 14px; white-space: nowrap;
  }
  .mav-label::before { display: none; } /* tooltip nyílvég elrejtése */
  .label-id { color: #000; font-weight: bold; }
  .label-desc { color: var(--pole-desc-color, #8a5a00); font-weight: bold; margin-left: 3px; }

  /* Leaflet saját kezelőfelület-elemeinek (réteg-választó, gombok) nagyítása */
  .leaflet-control-layers { font-size: 15px; }
  .leaflet-bar a { width: 34px; height: 34px; line-height: 34px; font-size: 18px; }
  .leaflet-popup-content { font-size: 15px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Nincs betöltött adat — válaszd ki a vonalakat, majd nyomd meg az "Adatok letöltése" gombot.</div>

<div id="balFelsoPanelek" style="position:absolute; top:54px; left:50px; z-index:1000; display:flex; flex-direction:column; gap:8px; max-width:280px;">
  <button id="saveSnapshotBtn" style="display:none; padding:6px 12px; border-radius:4px; border:1px solid #ccc; background:white; font-size:14px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.4);">
    Mentés adatok.geojson-ként
  </button>

  <details id="vonalPanel" open style="background:white; padding:8px 12px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.4); font-size:14px;">
    <summary style="cursor:pointer; font-weight:bold;">Figyelt vonalak</summary>
    <div id="vonalLista" style="margin-top:6px;"></div>
    <button id="adatokLetoltesBtn" style="margin-top:8px; padding:6px 12px; border-radius:4px; border:1px solid #ccc; background:#eef4ff; font-size:14px; cursor:pointer; width:100%;">
      Adatok letöltése
    </button>
  </details>

  <div style="background:white; padding:8px 12px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.4); font-size:14px;">
    <label for="manualFileInput">Helyi fájl betöltése (ha az élő adat hibás/hiányos):</label><br>
    <input type="file" id="manualFileInput" accept=".geojson,.json" />
  </div>

  <div style="background:white; padding:8px 12px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.4); font-size:14px;">
    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
      <input type="checkbox" id="szerkesztoiModKapcsolo" />
      Szerkesztői mód (elemek mozgatása)
    </label>
  </div>
</div>

<!-- Szerkesztő-modal: a popup "Szerkesztés" gombja ezt nyitja meg, iframe-ben, új lap helyett. -->
<div id="szerkesztoModal" style="display:none; position:fixed; inset:0; z-index:2000; background:rgba(0,0,0,0.4);">
  <div style="position:absolute; top:5%; left:5%; right:5%; bottom:5%; background:white; border-radius:8px; overflow:hidden; display:flex; flex-direction:column;">
    <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 14px; border-bottom:1px solid #eee;">
      <strong>Oszlop szerkesztése</strong>
      <button id="szerkesztoModalBezar" style="font-size:20px; border:none; background:none; cursor:pointer; line-height:1; padding:4px 8px;">✕</button>
    </div>
    <iframe id="szerkesztoIframe" style="flex:1; border:none; width:100%;"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-locatecontrol/0.79.0/L.Control.Locate.min.js"></script>
<script src="./oszlop_visszafejto.js"></script>
<script src="./terkep_motor.js"></script>

</body>
</html>
