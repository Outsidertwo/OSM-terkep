<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<title>MÁV elemek — 120a és 82 vonal</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet-locatecontrol/0.79.0/L.Control.Locate.min.css" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; font-size: 16px; }
  #map { width: 100%; height: 100vh; }
  #status {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: white; padding: 8px 14px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4); font-size: 16px;
    max-width: 60vw;
  }
  #loader {
    position: absolute; top: 54px; left: 50px; z-index: 1000;
    background: white; padding: 8px 12px; border-radius: 4px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.4); font-size: 13px;
  }
  .mav-icon {
    border-radius: 50%; border: 2px solid white;
    box-shadow: 0 0 3px rgba(0,0,0,0.6);
  }
  .mav-icon.diamond {
    border-radius: 2px; transform: rotate(45deg);
  }
  .mav-icon.cross {
    border-radius: 3px;
  }
  .popup-table { font-size: 15px; border-collapse: collapse; }
  .popup-table td { padding: 3px 8px 3px 0; vertical-align: top; }
  .popup-table td:first-child { color: #555; white-space: nowrap; }

  /* --- Térképi címkék (permanens tooltip-ek) --- */
  .mav-label {
    background: rgba(255,255,255,0.92);
    border: none; box-shadow: 0 0 2px rgba(0,0,0,0.5);
    padding: 2px 6px; font-size: 14px; white-space: nowrap;
  }
  .mav-label::before { display: none; } /* tooltip nyílvég elrejtése */
  .label-id { color: #000; font-weight: bold; }
  .label-desc { color: var(--pole-desc-color, #8a5a00); font-weight: bold; margin-left: 3px; }

  /* Leaflet saját kezelőfelület-elemeinek (réteg-választó, gombok) nagyítása */
  .leaflet-control-layers { font-size: 15px; }
  .leaflet-bar a { width: 34px; height: 34px; line-height: 34px; font-size: 18px; }
  .leaflet-popup-content { font-size: 15px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="status">Válaszd ki a letöltendő vonalakat lent, majd nyomd meg az "Adatok letöltése" gombot.</div>
<button id="saveSnapshotBtn" style="display:none; position:absolute; top:54px; left:50px; z-index:1000; padding:6px 12px; border-radius:4px; border:1px solid #ccc; background:white; font-size:14px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.4);">
  Mentés adatok.geojson-ként
</button>
<div style="position:absolute; top:98px; left:50px; z-index:1000; background:white; padding:8px 12px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.4); font-size:14px; display:flex; flex-direction:column; gap:8px; min-width:240px;">
  <div id="buildVerzio" style="font-size:11px; color:#888; user-select:all;"></div>
  <div>
    <label for="manualFileInput">Helyi fájl betöltése (ha az élő adat hibás/hiányos):</label><br>
    <input type="file" id="manualFileInput" accept=".geojson,.json" />
  </div>
  <button id="adatokLetoltesBtn" style="padding:6px 12px; border-radius:4px; border:1px solid #ccc; background:#eef4ff; font-size:14px; cursor:pointer;">
    Adatok letöltése
  </button>
</div>
<details id="vonalPanel" style="position:absolute; top:194px; left:50px; z-index:1000; background:white; padding:8px 12px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.4); font-size:14px; max-width:260px;">
  <summary style="cursor:pointer; font-weight:bold;">Megjelenített vonalak</summary>
  <div id="vonalLista" style="margin-top:6px;"></div>
</details>
<div id="pendingSzamlalo" style="position:absolute; top:194px; left:320px; z-index:1000; background:white; padding:8px 12px; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.4); font-size:13px; font-weight:bold; max-width:260px;"></div>
<button id="feltoltesBtn" style="display:none; position:absolute; top:238px; left:320px; z-index:1000; padding:6px 12px; border-radius:4px; border:1px solid #ccc; background:#eef4ff; font-size:14px; cursor:pointer; box-shadow:0 1px 4px rgba(0,0,0,0.4);">
  Változások feltöltése
</button>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-locatecontrol/0.79.0/L.Control.Locate.min.js"></script>
<script src="./osm_auth.js"></script>
<script src="./github_mentes.js"></script>
<script>
  // Build-verziószám: MINDEN egyes commitnál kézzel frissítendő (dátum + rövid leírás).
  // Ez a helyi fájl betöltése mező fölött jelenik meg -- innen mindig egyértelműen
  // látszik, hogy a böngésző tényleg a legfrissebb kódot szolgálja-e ki.
  const BUILD_VERZIO = '2026-08-22 -- 4. lépés (kötegelt feltöltés) + formazottRekord() "szellemadat" hiba javítása';
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('buildVerzio');
    if (el) el.textContent = 'Build: ' + BUILD_VERZIO;
  });
  console.log('[DIAG] BUILD_VERZIO =', BUILD_VERZIO);

  const map = L.map('map').setView([47.35, 19.85], 10);

  // Igaz, ha a felhasználó be van jelentkezve OSM-mel — ettől függ, hogy a popupban
  // megjelenik-e a Szerkesztés/Mozgatás gomb.
  let osmSzerkesztesEngedelyezve = false;

  // --- Alaptérkép réteg-választó (OSM standard / műholdas) ---
  const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 21,
    maxNativeZoom: 19, // a hivatalos OSM-csempeszerver ténylegesen csak 19-ig rendel valódi csempét
    attribution: '&copy; OpenStreetMap közreműködők'
  });
  // Google Műhold közvetlen, kulcs nélküli beágyazása nem szabályos, ezért Esri World Imagery helyettesíti.
  // Az Esri csempéi sok helyen csak 19-es zoomig léteznek ténylegesen — afölött a maxNativeZoom
  // nélkül üres/szürke csempét adna. maxNativeZoom-mal a böngésző a legrészletesebb elérhető
  // csempét nagyítja fel tovább, ahelyett hogy semmit se mutatna.
  // Az Esri csempéi sok helyen csak 19-es zoomig léteznek ténylegesen — vidéki, kevésbé
  // sűrűn fedett területeken (mint egy regionális vasútvonal) ez a valós felbontási határ
  // gyakran ennél is alacsonyabb. maxNativeZoom-mal a böngésző a legrészletesebb elérhető
  // csempét nagyítja fel tovább, ahelyett hogy semmit se mutatna.
  const satelliteLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
      maxZoom: 21,
      maxNativeZoom: 17,
      attribution: 'Tiles &copy; Esri — Esri, Maxar, Earthstar Geographics'
    }
  );
  osmLayer.addTo(map);

  // --- GPS gomb ---
  L.control.locate({ position: 'topleft', strings: { title: 'Saját pozícióm' }, flyTo: true }).addTo(map);

  // --- Kompakt OSM bejelentkezés-gomb (a GPS gomb alá kerül) ---
  const OsmBejelentkezesControl = L.Control.extend({
    options: { position: 'topleft' },
    onAdd: function () {
      const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
      const a = L.DomUtil.create('a', '', div);
      a.href = '#';
      a.style.fontSize = '16px';
      a.style.display = 'flex';
      a.style.alignItems = 'center';
      a.style.justifyContent = 'center';
      L.DomEvent.disableClickPropagation(div);
      L.DomEvent.on(a, 'click', (ev) => { L.DomEvent.preventDefault(ev); a.onOsmClick(); });
      this._link = a;
      return div;
    }
  });
  const osmBejelentkezesControl = new OsmBejelentkezesControl().addTo(map);
  const osmBejelentkezesLink = osmBejelentkezesControl._link;

  function osmBejelentkezesAllapotFrissit() {
    if (!osmAuth.tokenVan()) {
      osmBejelentkezesLink.textContent = '🔒';
      osmBejelentkezesLink.title = 'Bejelentkezés OSM-mel';
      osmBejelentkezesLink.onOsmClick = () => osmAuth.bejelentkezes();
      osmSzerkesztesEngedelyezve = false;
      if (typeof vonalListaKirajzolas === 'function' && VONALAK.length) vonalListaKirajzolas();
      return;
    }
    osmBejelentkezesLink.textContent = '🔓';
    osmBejelentkezesLink.title = 'Bejelentkezve — kattints a kijelentkezéshez';
    osmBejelentkezesLink.onOsmClick = () => {
      osmAuth.kijelentkezes();
      location.reload(); // hogy a már megnyitott popupokból is eltűnjön a Szerkesztés/Mozgatás gomb
    };
    osmSzerkesztesEngedelyezve = true;
    if (typeof vonalListaKirajzolas === 'function' && VONALAK.length) vonalListaKirajzolas();
    if (typeof osszesVonalAdatAllapotBetoltese === 'function') osszesVonalAdatAllapotBetoltese();
    osmAuth.sajatAdatok()
      .then(u => { osmBejelentkezesLink.title = 'Bejelentkezve mint: ' + u.display_name + ' — kattints a kijelentkezéshez'; })
      .catch(() => { /* a gomb ekkor is működik, csak a névvel nem tudunk kiegészülni */ });
  }

  const statusEl = document.getElementById('status');

  // A vonalanként (élőben) letöltött, összes elem — ebből szűr a "Megjelenített vonalak" panel,
  // hálózati kérés nélkül. Minden elem properties._vonal mezője jelzi, melyik vonalhoz
  // tartozik (átfedő vonalaknál egy elem csak az őt ténylegesen tartalmazó vonalhoz tartozik).
  let osszesFeature = [];
  const letoltottVonalak = new Set();
  // A sajat_adatok/{kod}.ndjson fájlok együttes tartalma _osm_id kulccsal — ez az elsődleges
  // forrás: offline/Overpass nélkül is ebből rajzolunk, az Overpass-eredmény pedig csak
  // frissíti/kiegészíti. Minden rekord saját _vonal mezőt visz magával (nem csak a fájl helye
  // jelzi a vonalat), hogy szerkesztés/mentés után is egyértelmű maradjon a hovatartozása.
  const sajatAdatokTerkep = new Map();

  const osszesMarker = []; // minden létrehozott marker, hogy szükség esetén elérhetők legyenek

  // A zoomszint, ami felett a clusterek egyedi pontokra bomlanak és a címkék megjelennek.
  // Egyelőre ideiglenes érték, terepi tapasztalat alapján finomítható.
  const LABEL_ZOOM = 16;

  // Útátjáró-csoportosítás: ilyen távolságon belüli level_crossing node-okat
  // egy logikai objektumként kezelünk (a legszélesebb, 4 vágányos átjáró ~25 m).
  const CROSSING_GROUP_RADIUS_M = 30;

  // ============================================================
  // MEGJELENÍTETT VONALAK ÉS ÜZEMELTETŐ
  // A vonalak.json külön fájlból töltődik be induláskor (lásd inditas),
  // hogy bővítéskor / névváltozáskor ne kelljen a kódhoz nyúlni. Ha a
  // fájl valamiért nem érhető el, ez a két érték biztonsági alapértelmezés.
  // ============================================================
  let UZEMELTETO = 'MÁV';
  let VONALAK = [
    { nev: '120a (Budapest–Szolnok)', kod: '120a', relation: 252069, aktiv: true },
    { nev: '82 (Hatvan–Újszász)', kod: '82', relation: 77374, aktiv: true },
    { nev: '100 (Budapest–Záhony)', kod: '100', relation: 4481917, aktiv: true }
  ];

  // A vonal rövid fájlnév-kódja — a vonalak.json "kod" mezőjéből, régebbi/hiányos
  // konfigurációnál biztonsági tartalékként a névből (a zárójel előtti rész) képezve.
  function vonalKodja(vonal) {
    return vonal.kod || (vonal.nev || '').split(' ')[0];
  }


  // ============================================================
  // TÍPUSDEFINÍCIÓK
  // (Ez a blokk később egy külön konfiguracio.json fájlba kerül majd ki.)
  // ============================================================
  const TYPES = [
    {
      key: 'oszlop',
      label: 'Felsővezeték-oszlop',
      color: '#1ae86b',
      shape: 'circle',
      test: (t) => t.power === 'catenary_mast',
      buildLabelHtml: (t) => {
        // Azonosító (oszlopszám) — fekete. Hosszabb távon ref= a helyes tag,
        // de amíg a meglévő oszlopok name=-ben vannak, mindkettőt kezeljük.
        const idRaw = t.ref || t.name;
        const idPart = idRaw ? `<span class="label-id">${escapeHtml(idRaw)}</span>` : '';

        // Leíró adatok — típus + aktív logikai jelzők, második színnel.
        // Ezek egyelőre saját (nem hivatalos OSM) mezők, a nevük még finomítható,
        // amint elkészül az adatlap és eldől a tényleges tag-elnevezés.
        const descBits = [];
        if (t.tipus_betujel) descBits.push(escapeHtml(t.tipus_betujel));
        if (t.szikrakoz === 'yes') descBits.push('szk');
        if (t.sulyos === 'yes') descBits.push('s');
        if (t.fixpont === 'yes') descBits.push('fx');
        if (t.foldelesipont === 'yes') descBits.push('fp');
        const descPart = descBits.length > 0
          ? `<span class="label-desc">${descBits.join(' ')}</span>`
          : '';

        if (!idPart && !descPart) return null;
        return idPart + descPart;
      }
    },
    {
      key: 'szelvenyko',
      label: 'Szelvénykő',
      color: '#1a73e8',
      shape: 'diamond',
      test: (t) => t.railway === 'milestone',
      buildLabelHtml: (t) => {
        if (!t.name) return null;
        return `<span class="label-id">${escapeHtml(t.name)}</span>`;
      }
    },
    {
      key: 'atjaro',
      label: 'Útátjáró',
      color: '#e8341a',
      shape: 'cross',
      test: (t) => t.railway === 'level_crossing', // operator-tól függetlenül is idesorolva (lásd bővített Overpass-lekérdezés)
      groupRadiusM: CROSSING_GROUP_RADIUS_M,
      buildLabelHtml: (t) => {
        const parts = [];
        if (t.ref) parts.push(escapeHtml(t.ref));
        if (t.maxheight) parts.push(escapeHtml(t.maxheight) + ' m');
        if (parts.length === 0) return null;
        return `<span class="label-id">${parts.join(' · ')}</span>`;
      }
    },
    {
      key: 'egyeb',
      label: 'Egyéb MÁV elem',
      color: '#999999',
      shape: 'circle',
      defaultVisible: false, // gyűjtő kategória (kitérő, jelző, állomás stb.) — csak kérésre jelenjen meg
      test: () => true, // gyűjtő kategória: minden, ami nem a fenti három típus egyike
      buildLabelHtml: (t) => {
        const idRaw = t.ref || t.name;
        return idRaw ? `<span class="label-id">${escapeHtml(idRaw)}</span>` : null;
      }
    }
  ];
  // Egyelőre rejtve: railway=switch / signal / station / halt / stop / junction / radio stb.

  // ============================================================
  // MAGYAR FORDÍTÁSI SZÓTÁR
  // (Ez a blokk is a későbbi konfiguracio.json-ba kerül majd ki.)
  // Cél: a popup ablak és az adatlap magyarul jelenjen meg,
  // a mögöttes OSM-tagek angol nevei/értékei változatlanok maradnak.
  // ============================================================
  // Az Overpass Turbo GeoJSON-exportja ezeket a kozmetikai (nem valódi OSM-tag) mezőket
  // is hozzáadja a stílus alapján — ezek a popupban csak zajt jelentenének, kiszűrjük.
  const REJTETT_MEZOK = new Set([
    'icon', 'icon-color', 'icon-opacity', 'icon-scale', 'icon-offset',
    'icon-offset-units', 'label-scale', 'styleUrl',
    'operator', 'operator:wikidata', 'power'
  ]);

  const MEZO_FORDITAS = {
    railway: 'Típus (railway)',
    power: 'Típus (power)',
    operator: 'Üzemeltető',
    'operator:wikidata': 'Üzemeltető (Wikidata)',
    name: 'Név/szám (name)',
    'name:ru': 'Név (oroszul)',
    ref: 'Azonosító (ref)',
    'ref:mav': 'MÁV-azonosító',
    'ref:MAV': 'MÁV-azonosító',
    'railway:ref': 'Vasúti azonosító',
    local_ref: 'Helyi azonosító',
    maxheight: 'Legnagyobb magasság',
    'railway:position': 'Szelvényezési hely (km)',
    'railway:position:exact': 'Pontos szelvényezési hely',
    crossing: 'Átjáró védettsége',
    'crossing:barrier': 'Sorompó',
    'crossing:light': 'Fényjelzés',
    'crossing:bell': 'Hangjelzés',
    supervised: 'Felügyelt',
    informal: 'Nem hivatalos',
    material: 'Anyag',
    structure: 'Szerkezet',
    voltage: 'Feszültség',
    location: 'Elhelyezkedés',
    direction: 'Irány',
    switch: 'Szakaszoló',
    'communication:gsm-r': 'GSM-R',
    description: 'Leírás',
    source: 'Forrás',
    website: 'Weboldal',
    wikidata: 'Wikidata',
    wikipedia: 'Wikipédia',
    wikimedia_commons: 'Wikimedia Commons',
    wheelchair: 'Kerekesszékkel',
    public_transport: 'Közösségi közlekedés',
    train: 'Vonat megáll',
    uic_ref: 'UIC-azonosító',
    man_made: 'Mesterséges létesítmény',
    line_attachment: 'Vezeték-rögzítés',
    information: 'Információ',
    tourism: 'Turizmus',
    'addr:city': 'Település',
    'addr:street': 'Utca',
    'addr:housenumber': 'Házszám',
    'addr:postcode': 'Irányítószám',
    '@id': 'OSM azonosító'
  };

  const ERTEK_FORDITAS = {
    railway: { milestone: 'Szelvénykő', level_crossing: 'Útátjáró', switch: 'Kitérő', signal: 'Jelző', station: 'Állomás', halt: 'Megállóhely', stop: 'Megálló', junction: 'Csomópont' },
    power: { catenary_mast: 'Felsővezeték-oszlop' },
    crossing: { uncontrolled: 'Jelzés nélküli', traffic_signals: 'Fénysorompós', no_signals: 'Jelzés nélküli' },
    'crossing:barrier': { full: 'Teljes sorompó', half: 'Fél sorompó', no: 'Nincs sorompó' }
  };

  function magyarMezonev(kulcs) {
    return MEZO_FORDITAS[kulcs] || kulcs;
  }

  function magyarErtek(kulcs, ertek) {
    if (ertek === 'yes') return 'igen';
    if (ertek === 'no') return 'nem';
    const tablazat = ERTEK_FORDITAS[kulcs];
    if (tablazat && tablazat[ertek]) return tablazat[ertek];
    return ertek;
  }

  // Oszlop-típusbetűjel → a majdani mentéskor felírandó OSM-mezők.
  // Egyelőre csak adatmodell, a tényleges OSM-írás a 2. (GitHub Pages-es) fázisban készül el.
  const TIPUS_LEKEPEZES = {
    'T':   { structure: 'frame', material: 'steel' },   // Tartó oszlop, U-acél
    'L':   { structure: 'frame', material: 'steel' },   // Lengő oszlop, U-acél
    'Ta':  { structure: 'frame', material: 'steel' },   // Lehorgonyzó oszlop, U-acél
    'F':   { structure: 'frame', material: 'steel' },   // Feszítő oszlop, szögacél
    'K':   { structure: 'frame', material: 'steel' },   // Kereszt felfüggesztési oszlop, szögacél
    'KR':  { structure: 'portal', material: 'steel' },  // Portálszerkezet tartó oszlop
    'MKR': { structure: 'portal', material: 'steel' },  // Mini KR
    'P':   { structure: 'pole', material: 'concrete' }, // Pörgetett betonacél oszlop
    'BM':  { structure: 'pole', material: 'concrete' },
    'CSŐ': { structure: 'pole', material: 'steel' }     // Acél csőoszlop
    // A "C" végződés (tőcsavaros kivitel) és a fa segédoszlop (szám végi "F")
    // az adatlap elkészültekor kap majd saját mezőt/kiegészítő logikát.
  };

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // --- Cluster-csoportok, típusonként külön ---
  const clusterGroups = {};
  TYPES.forEach(type => {
    clusterGroups[type.key] = L.markerClusterGroup({
      disableClusteringAtZoom: LABEL_ZOOM,
      iconCreateFunction: (cluster) => {
        const count = cluster.getChildCount();
        return L.divIcon({
          html: `<div style="background:${type.color}; color:white; border-radius:50%;
                      width:34px; height:34px; display:flex; align-items:center;
                      justify-content:center; font-weight:bold; font-size:12px;
                      border:2px solid white; box-shadow:0 0 3px rgba(0,0,0,0.6);">
                   ${count}
                 </div>`,
          className: '', iconSize: [34, 34]
        });
      }
    });
    if (type.defaultVisible !== false) {
      clusterGroups[type.key].addTo(map);
    }
  });

  function makeIcon(color, shape) {
    const shapeClass = shape === 'diamond' ? 'diamond' : (shape === 'cross' ? 'cross' : '');
    const inner = shape === 'diamond' ? 'width:12px; height:12px;' : 'width:14px; height:14px;';
    return L.divIcon({
      className: `mav-icon ${shapeClass}`,
      html: `<div style="background:${color}; ${inner} border-radius:${shape === 'cross' ? '3px' : '50%'};"></div>`,
      iconSize: [14, 14]
    });
  }

  function popupContent(tags, type, lat, lon) {
    const rows = Object.entries(tags)
      .filter(([k]) => !REJTETT_MEZOK.has(k) && k !== '_vonal' && k !== '_osm_id' && k !== '_sajat')
      .sort(([a], [b]) => a.localeCompare(b))
      .map(([k, v]) => `<tr><td>${escapeHtml(magyarMezonev(k))}</td><td>${escapeHtml(magyarErtek(k, v))}</td></tr>`)
      .join('');

    // Az OSM node saját azonosítója — nem tag, hanem az elem saját id-ja; külön, jól
    // látható sorban jelenítjük meg, hogy pl. az OSM-feltöltés teszthez könnyen kéznél legyen.
    let osmIdSor = '';
    if (tags._osm_id) {
      osmIdSor = `<div style="font-size:12px; color:#888; margin-bottom:4px;">
        OSM node ID: <b>${escapeHtml(tags._osm_id)}</b>
        (<a href="https://www.openstreetmap.org/node/${escapeHtml(tags._osm_id)}" target="_blank">megnyitás</a>)
      </div>`;
    }

    // A mentett, csak nálunk (GitHub-on) létező kiegészítő adatok — nem hivatalos OSM-tagek,
    // ezért külön, elválasztva jelenítjük meg. A nyers/technikai mezőket (osm_tagek, lat, lon,
    // szam — ez utóbbi már a fenti táblázatban is szerepel ref/name formában) kihagyjuk.
    let sajatSor = '';
    if (tags._sajat) {
      const KIHAGYVA = new Set(['osm_tagek', 'lat', 'lon', 'szam', 'tartoszerkezetek', '_osm_id']);
      const sajatSorok = Object.entries(tags._sajat)
        .filter(([k, v]) => !KIHAGYVA.has(k) && v !== '' && v !== false && v != null)
        .map(([k, v]) => {
          const cimke = k.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase());
          const ertek = v === true ? 'igen' : v;
          return `<tr><td>${escapeHtml(cimke)}</td><td>${escapeHtml(String(ertek))}</td></tr>`;
        })
        .join('');
      if (sajatSorok) {
        sajatSor = `<div style="font-size:12px; color:#888; margin:8px 0 2px;">Mentett kiegészítő adatok:</div>
          <table class="popup-table">${sajatSorok}</table>`;
      }
    }

    // Szerkesztés gomb — csak bejelentkezve (mivel csak akkor tudnánk menteni is
    // az eredményt), és egyelőre csak oszlophoz van kész adatlap-séma.
    // (A korábbi Mozgatás gomb/pozíció-szerkesztés eltávolítva: a Leaflet.markercluster
    // plugin saját, belső mechanizmusa a húzás indulásakor mindig bezárta a popupot,
    // ez a plugin szándékos viselkedése, nem hiba -- a pozíció-pontosítás ezután
    // OSM-szerkesztőben (pl. iD, JOSM) történik.)
    let gombok = '';
    if (osmSzerkesztesEngedelyezve && type && type.key === 'oszlop' && tags._osm_id) {
      const tisztaTagek = { ...tags };
      delete tisztaTagek._vonal;
      delete tisztaTagek._sajat;
      // FONTOS: a _sajat (korábban mentett kiegészítő adatok) NEM törlődik ki a payloadból,
      // hanem külön mezőként átmegy -- eddig itt veszett el a korábbi mentés az adatlap
      // megnyitásakor, ezért tűnt úgy, mintha a Mentés gomb "nem csinálna semmit".
      const payload = { tagek: tisztaTagek, lat, lon };
      if (tags._sajat) payload.sajat = tags._sajat;
      // A vonal-hovatartozás (teljes név + rövid fájlkód) is átmegy, hogy a Mentés gomb
      // tudja, melyik sajat_adatok/{kod}.ndjson fájlba kell írnia.
      if (tags._vonal) {
        payload.vonal = tags._vonal;
        const vonalObj = VONALAK.find(v => v.nev === tags._vonal);
        payload.vonalKod = vonalObj ? vonalKodja(vonalObj) : null;
      }
      const kodolt = encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
      gombok = `<div style="margin-top:8px; display:flex; gap:6px;">
        <button onclick="window.open('adatlap.html?adat=${kodolt}', '_blank')"
                style="font-size:13px; padding:4px 10px; border:1px solid #ccc; border-radius:4px; background:#f0f0f0; cursor:pointer;">
          Szerkesztés
        </button>
      </div>`;
    }

    return `${osmIdSor}<table class="popup-table">${rows}</table>${sajatSor}${gombok}`;
  }

  function classify(tags) {
    for (const type of TYPES) {
      if (type.test(tags)) return type;
    }
    return null;
  }

  // --- Haversine távolság méterben ---
  function distanceM(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.asin(Math.sqrt(a));
  }

  // --- Közeli, azonos típusú pontok csoportosítása (pl. útátjárók vágányonként) ---
  function groupPoints(points, radiusM) {
    const groups = [];
    points.forEach(p => {
      let target = null;
      for (const g of groups) {
        if (distanceM(g.lat, g.lon, p.lat, p.lon) <= radiusM) { target = g; break; }
      }
      if (target) {
        target.members.push(p);
        target.lat = target.members.reduce((s, m) => s + m.lat, 0) / target.members.length;
        target.lon = target.members.reduce((s, m) => s + m.lon, 0) / target.members.length;
      } else {
        groups.push({ lat: p.lat, lon: p.lon, members: [p] });
      }
    });
    return groups;
  }

  // --- Réteg-választó: alaptérkép + elemtípusok ---
  const layerControl = L.control.layers(
    { 'OpenStreetMap': osmLayer, 'Műholdas (Esri)': satelliteLayer },
    {}, { collapsed: false, position: 'topright' }
  ).addTo(map);
  TYPES.forEach(type => layerControl.addOverlay(clusterGroups[type.key], type.label));

  function addMarker(type, lat, lon, tags, memberCount, feature) {
    const marker = L.marker([lat, lon], { icon: makeIcon(type.color, type.shape), draggable: false });
    marker.bindPopup(popupContent(tags, type, lat, lon));
    // DIAGNOSZTIKA: ha a popup bezárul, kiírjuk a hívási láncot (stack trace) is --
    // ebből látszik, mi zárta be (natív X gomb, vagy pl. egy loadGeoJSON-újrarajzolás).
    marker.on('popupclose', () => {
      console.log('[DIAG] popupclose', tags.ref || tags.name || '(?)');
      console.trace('[DIAG] popupclose stack');
    });
    const labelHtml = type.buildLabelHtml(tags);
    if (labelHtml) {
      marker.bindTooltip(labelHtml, {
        permanent: true, direction: 'right', offset: [8, 0], className: 'mav-label'
      });
    }

    osszesMarker.push(marker);
    clusterGroups[type.key].addLayer(marker);
  }


  function loadGeoJSON(geojson) {
    // DIAGNOSZTIKA: ez a függvény TÖRLI és ÚJRAÉPÍTI az összes markert (clearLayers +
    // addMarker mindenre) -- ha ez épp akkor fut le, amikor valakinek nyitva van egy
    // popupja (pl. szerkesztés/mozgatás közben), az a nyitott popup markerét is
    // eltünteti, ami a popup bezáródásaként jelentkezik. A stack trace megmutatja,
    // MELYIK kód hívta meg (pl. inditas / betoltesIndul / vonal-checkbox váltás).
    console.log('[DIAG] loadGeoJSON fut -- feature-ök száma:', geojson.features.length);
    console.trace('[DIAG] loadGeoJSON hívási lánc');
    TYPES.forEach(t => clusterGroups[t.key].clearLayers());
    osszesMarker.length = 0;
    const counts = {};
    TYPES.forEach(t => counts[t.key] = 0);

    // Elsőként típusonként szétválogatjuk a pontokat.
    const byType = {};
    TYPES.forEach(t => byType[t.key] = []);

    geojson.features.forEach(f => {
      if (!f.geometry || f.geometry.type !== 'Point' || !f.properties) return;
      const tags = f.properties;
      const type = classify(tags); // az "egyeb" gyűjtőtípus miatt ez sosem null
      const [lon, lat] = f.geometry.coordinates;
      byType[type.key].push({ lat, lon, tags, feature: f });
    });

    TYPES.forEach(type => {
      const points = byType[type.key];
      if (type.groupRadiusM) {
        // Csoportosítandó típus (pl. útátjáró): közeli pontokat összevonjuk.
        const groups = groupPoints(points, type.groupRadiusM);
        groups.forEach(g => {
          addMarker(type, g.lat, g.lon, g.members[0].tags, g.members.length, g.members[0].feature);
          counts[type.key]++;
        });
      } else {
        points.forEach(p => {
          addMarker(type, p.lat, p.lon, p.tags, undefined, p.feature);
          counts[type.key]++;
        });
      }
    });

    const summary = TYPES.map(t => `${t.label}: ${counts[t.key]}`).join(' · ');
    statusEl.textContent = `Betöltve — ${summary}`;

    const allLayers = TYPES.map(t => clusterGroups[t.key]).filter(g => g.getLayers().length > 0);
    if (allLayers.length > 0) {
      const group = L.featureGroup(allLayers.flatMap(g => g.getLayers()));
      map.fitBounds(group.getBounds().pad(0.1));
    }
  }

  // Élő Overpass-lekérdezés VONALANKÉNT (nem összevonva) — ez teszi lehetővé, hogy a
  // "Megjelenített vonalak" pipálás utólag, hálózati kérés nélkül tudjon szűrni, még akkor is,
  // ha két vonal fizikailag átfedi egymást (pl. egy csomópontnál).
  function buildOverpassQueryForLine(line) {
    return `
      [out:json][timeout:180];
      rel(${line.relation}); way(r)->.w;
      node(around.w:50)["operator"="${UZEMELTETO}"]->.elemek;
      .elemek out body;
    `;
  }

  // Több Overpass-tükör, sorban kipróbálva — ha az egyik hibázik vagy időtúllépést ad,
  // a következővel próbálkozunk. Ha egyik sem válaszol időben, a .html mellé tett
  // helyi GeoJSON-fájlra esik vissza (adatok.geojson), hogy gyenge/nincs neten is működjön.
  const OVERPASS_ENDPOINTS = [
    'https://overpass-api.de/api/interpreter',
    'https://overpass.kumi.systems/api/interpreter'
  ];
  const OVERPASS_TIMEOUT_MS = 25000; // egy-egy tükörre max ennyit várunk
  const LOCAL_SNAPSHOT_PATH = './adatok.geojson';

  async function fetchWithTimeout(url, options, timeoutMs) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      return await fetch(url, { ...options, signal: controller.signal });
    } finally {
      clearTimeout(timer);
    }
  }

  async function fetchOverpassWithFallback(query) {
    if (!navigator.onLine) {
      throw new Error('Nincs internetkapcsolat, helyi fájlra váltás.');
    }
    let lastError = null;
    for (const endpoint of OVERPASS_ENDPOINTS) {
      try {
        statusEl.textContent = `Élő adat lekérése (${endpoint.split('/')[2]})...`;
        const res = await fetchWithTimeout(endpoint, {
          method: 'POST',
          body: 'data=' + encodeURIComponent(query)
        }, OVERPASS_TIMEOUT_MS);
        if (!res.ok) throw new Error(`${endpoint} — HTTP ${res.status}`);
        return await res.json();
      } catch (err) {
        console.warn('Overpass tükör sikertelen:', endpoint, err);
        lastError = err;
      }
    }
    throw lastError || new Error('Ismeretlen hiba az Overpass-lekérdezés közben.');
  }

  function overpassToGeoJSON(data, vonalNev) {
    return data.elements
      .filter(el => el.type === 'node')
      .map(el => ({
        type: 'Feature',
        properties: { ...(el.tags || {}), _vonal: vonalNev, _osm_id: el.id },
        geometry: { type: 'Point', coordinates: [el.lon, el.lat] }
      }));
  }

  // --- Helyi (localStorage) cache -- vonalanként külön kulcs, vonalanként külön fájl ---
  function ndjsonCacheKulcs(kod) { return `sajat_adatok_ndjson_cache_${kod}`; }
  function ndjsonCacheIdobelyegKulcs(kod) { return `sajat_adatok_ndjson_cache_ido_${kod}`; }

  function ndjsonCacheOlvasas(kod) {
    try {
      return localStorage.getItem(ndjsonCacheKulcs(kod));
    } catch (err) {
      console.warn('localStorage nem elérhető (olvasás):', err);
      return null;
    }
  }

  function ndjsonCacheIrasa(kod, szoveg) {
    try {
      localStorage.setItem(ndjsonCacheKulcs(kod), szoveg);
      localStorage.setItem(ndjsonCacheIdobelyegKulcs(kod), new Date().toISOString());
    } catch (err) {
      // pl. megtelt a tárhely, vagy inkognitó mód -- nem végzetes, csak nem cache-elünk
      console.warn('localStorage nem elérhető (írás):', err);
    }
  }

  // A szöveget feldolgozza és a sajatAdatokTerkep-be tölti (a többi, már betöltött vonal
  // rekordjait nem érinti -- csak hozzáad/felülír _osm_id szerint).
  function ndjsonSzovegFeldolgozasa(szoveg) {
    szoveg.split('\n').filter(s => s.trim() !== '').forEach(sor => {
      try {
        const rekord = JSON.parse(sor);
        if (rekord._osm_id) sajatAdatokTerkep.set(String(rekord._osm_id), rekord);
      } catch (err) {
        console.warn('Hibás sor egy sajat_adatok fájlban, kihagyva:', sor);
      }
    });
  }

  // Mely vonalak sajat_adatok/{kod}.ndjson fájlja lett már betöltve (cache-ből vagy
  // hálózatról) ebben a munkamenetben -- ne töltsük be kétszer feleslegesen.
  const betoltottSajatVonalak = new Set();

  // Egyetlen vonal sajat_adatok/{kod}.ndjson fájljának betöltése.
  // 1. Ha van helyi (localStorage) cache erre a vonalra, AZONNAL abból épít -- offline is
  //    működik, gyors indítás, akkor is, ha a cache régebbi/hiányos.
  // 2. Hálózat esetén háttérben (nem blokkolva) lekéri a friss fájlt, és csak akkor frissíti
  //    a cache-t/térképet, ha ténylegesen változott a tartalom.
  // 3. Ha nincs cache (első alkalom ezen a vonalon, ezen az eszközön), meg kell várni a
  //    hálózati letöltést. 404 esetén nem hiba -- azt jelenti, még nincs adat ezen a vonalon.
  async function vonalSajatAdatBetoltese(vonal) {
    const kod = vonalKodja(vonal);
    if (betoltottSajatVonalak.has(kod)) return;
    betoltottSajatVonalak.add(kod);
    console.log('[DIAG] vonalSajatAdatBetoltese indul:', kod);
    const cachelt = ndjsonCacheOlvasas(kod);

    if (cachelt) {
      ndjsonSzovegFeldolgozasa(cachelt);
      console.log('[DIAG] vonalSajatAdatBetoltese: helyi cache-ből betöltve:', kod);
      vonalSajatAdatHatterFrissites(vonal); // nem várjuk meg -- csendben fut, ha van net
      return;
    }

    try {
      const res = await fetch(`./sajat_adatok/${kod}.ndjson`);
      if (!res.ok) {
        if (res.status !== 404) console.warn(`sajat_adatok/${kod}.ndjson nem tölthető be:`, res.status);
        return; // 404: még nincs regisztrált adat ezen a vonalon -- nem hiba
      }
      const szoveg = await res.text();
      ndjsonSzovegFeldolgozasa(szoveg);
      ndjsonCacheIrasa(kod, szoveg);
      console.log('[DIAG] vonalSajatAdatBetoltese: hálózatról betöltve és cache-elve:', kod);
    } catch (err) {
      console.warn(`sajat_adatok/${kod}.ndjson betöltése sikertelen (és nincs helyi cache sem):`, err);
    }
  }

  // Csendes háttér-frissítés egy vonalra: csak akkor ír bármit, ha van hálózat ÉS
  // ténylegesen változott a tartalom. Hiba esetén (nincs net, stb.) nem jelez semmit --
  // ez a normál offline eset.
  async function vonalSajatAdatHatterFrissites(vonal) {
    const kod = vonalKodja(vonal);
    try {
      const res = await fetch(`./sajat_adatok/${kod}.ndjson`, { cache: 'no-store' });
      if (!res.ok) return;
      const szoveg = await res.text();
      if (szoveg === ndjsonCacheOlvasas(kod)) {
        console.log('[DIAG] háttér-frissítés (%s): nincs változás', kod);
        return;
      }
      console.log('[DIAG] háttér-frissítés (%s): változás észlelve, frissítés', kod);
      ndjsonSzovegFeldolgozasa(szoveg);
      ndjsonCacheIrasa(kod, szoveg);
      osszesFeature = featureekOsszefesulese(osszesFeature, sajatAdatokFeatureKent());
      alkalmazSzurokEsRajzol();
      statusEl.textContent = `Frissült a(z) ${vonal.nev} mentett adata -- háttérben szinkronizálva.`;
      statusEl.style.color = '#2a7d2a';
    } catch (err) {
      console.log(`[DIAG] háttér-frissítés kihagyva (${kod}, nincs hálózat vagy hiba):`, err.message);
    }
  }

  // A közös, GitHub-on tárolt kiegészítő adatfájlok betöltése -- az összes jelenleg
  // aktív (megjelenített) vonalra, párhuzamosan.
  async function sajatAdatokBetoltese() {
    console.log('[DIAG] sajatAdatokBetoltese indul');
    await Promise.all(VONALAK.filter(v => v.aktiv).map(v => vonalSajatAdatBetoltese(v)));
    console.log('[DIAG] sajatAdatokBetoltese kész, rekordok száma összesen:', sajatAdatokTerkep.size);
  }

  // A sajatAdatokTerkep tartalmából épít geojson feature-öket (csak azokból a rekordokból,
  // amikhez van mentett koordináta) — ez az elsődleges, Overpass nélkül is használható forrás.
  //
  // A helyi (még fel nem töltött) pending-módosítások mindig felülírják a GitHub-ból
  // cache-elt verziót MEGJELENÍTÉSKOR, anélkül hogy a sajatAdatokTerkep-et (a "tiszta"
  // GitHub-cache-t) piszkálnánk -- így egy háttér-frissítés nem tudja véletlenül felülcsapni
  // vagy eltüntetni egy helyi pending módosítást (3. lépés, offline-first átalakítás).
  function sajatAdatokFeatureKent() {
    const pending = (typeof githubMentes !== 'undefined') ? githubMentes.pendingOlvasas() : {};
    const feats = [];
    sajatAdatokTerkep.forEach((rekord, osmId) => {
      const eff = pending[osmId] ? pending[osmId].rekord : rekord;
      if (eff.lat == null || eff.lon == null) return;
      feats.push({
        type: 'Feature',
        properties: { ...(eff.osm_tagek || {}), _vonal: eff._vonal, _osm_id: Number(osmId), _sajat: eff },
        geometry: { type: 'Point', coordinates: [eff.lon, eff.lat] }
      });
    });
    // Olyan pending rekordok is bekerülnek, amiknek _osm_id-ja MÉG NINCS a sajatAdatokTerkep-ben
    // (pl. ha valaha lehetővé válik teljesen új oszlop kézi felvétele Overpass-regisztráció
    // nélkül -- jelenleg ez nem jellemző eset, de a kód legyen rá felkészülve).
    Object.entries(pending).forEach(([osmId, p]) => {
      if (sajatAdatokTerkep.has(osmId)) return; // már kezelve fentebb
      const r = p.rekord;
      if (r.lat == null || r.lon == null) return;
      feats.push({
        type: 'Feature',
        properties: { ...(r.osm_tagek || {}), _vonal: r._vonal, _osm_id: Number(osmId), _sajat: r },
        geometry: { type: 'Point', coordinates: [r.lon, r.lat] }
      });
    });
    return feats;
  }

  // A "Megjelenített vonalak" panel közelében lévő pending-számláló frissítése -- akkor kell
  // hívni, amikor a pending-lista változhatott (minden újrarajzoláskor, alkalmazSzurokEsRajzol
  // elején, illetve cross-tab storage-eseményre).
  function pendingSzamlaloFrissites() {
    const el = document.getElementById('pendingSzamlalo');
    const feltoltesBtnEl = document.getElementById('feltoltesBtn');
    if (!el || typeof githubMentes === 'undefined') return;
    const darab = githubMentes.pendingDarab();
    if (feltoltesBtnEl) feltoltesBtnEl.style.display = darab > 0 ? '' : 'none';
    if (darab === 0) {
      el.textContent = '';
      return;
    }
    const pending = githubMentes.pendingOlvasas();
    const most = Date.now();
    const TIZENKET_ORA_MS = 12 * 60 * 60 * 1000;
    const vanRegi = Object.values(pending).some(p => {
      const mentve = Date.parse(p.mentesIdo);
      return !isNaN(mentve) && (most - mentve) > TIZENKET_ORA_MS;
    });
    if (vanRegi) {
      el.textContent = `⚠ ${darab} mentetlen módosítás -- van köztük 12 óránál régebbi is!`;
      el.style.color = '#b30000';
    } else {
      el.textContent = `⚠ ${darab} mentetlen módosítás (még nincs feltöltve GitHub-ra)`;
      el.style.color = '#b36b00';
    }
  }

  // Két feature-lista összefésülése _osm_id szerint: az ujLista (pl. friss Overpass-adat)
  // felülírja a regiLista azonos id-jű elemeit (friss OSM-tagekkel), de a mentett _sajat
  // kiegészítő adatot áthozza a régi elemről, hogy ne vesszen el -- CSAK akkor, ha az
  // ujLista elemének NINCS saját _sajat mezője (ez a "sima Overpass" eset). Ha az ujLista
  // már hoz saját _sajat-ot (pl. sajatAdatokFeatureKent() hívásból, háttér-frissítés vagy
  // pending-módosítás után), az az érvényes és NEM írható felül a régivel -- különben a
  // frissítés/mentés láthatatlan maradna a térképen. Az id nélküli elemek (nem várt eset,
  // de biztonsági háló) egyszerűen egymás mellé kerülnek.
  function featureekOsszefesulese(regiLista, ujLista) {
    console.log('[DIAG] featureekOsszefesulese: régi=', regiLista.length, 'új=', ujLista.length);
    const idNelkuliek = regiLista.filter(f => !f.properties._osm_id);
    const map = new Map();
    regiLista.forEach(f => { if (f.properties._osm_id) map.set(String(f.properties._osm_id), f); });
    ujLista.forEach(f => {
      const kulcs = f.properties._osm_id ? String(f.properties._osm_id) : null;
      if (kulcs && map.has(kulcs) && !f.properties._sajat) {
        const regiSajat = map.get(kulcs).properties._sajat;
        if (regiSajat) f.properties._sajat = regiSajat;
      }
      if (kulcs) map.set(kulcs, f);
      else idNelkuliek.push(f);
    });
    const eredmeny = [...idNelkuliek, ...Array.from(map.values())];
    console.log('[DIAG] featureekOsszefesulese kész: eredmény=', eredmeny.length,
      '(id nélküli=', idNelkuliek.length, ', egyedi id=', map.size, ')');
    return eredmeny;
  }

  async function loadLocalSnapshot() {
    statusEl.textContent = 'Helyi adatfájl betöltése (adatok.geojson)...';
    const res = await fetch(LOCAL_SNAPSHOT_PATH);
    if (!res.ok) throw new Error(`Helyi fájl sem elérhető (HTTP ${res.status})`);
    return await res.json();
  }

  // A ténylegesen megjelenő adatot az aktív vonalak alapján, hálózati kérés nélkül állítja
  // elő az osszesFeature-ből — ezt hívja a checkbox-pipálás is.
  function alkalmazSzurokEsRajzol() {
    console.log('[DIAG] alkalmazSzurokEsRajzol meghívva, osszesFeature.length=', osszesFeature.length);
    pendingSzamlaloFrissites();
    const aktivNevek = new Set(VONALAK.filter(v => v.aktiv).map(v => v.nev));
    // Ha egy elemen nincs _vonal jelölés (pl. régebbi, a vonalankénti lekérés előtti mentésből
    // származik), biztonságból megjelenítjük — jobb, mint véletlenül eltüntetni valamit.
    const szurt = osszesFeature.filter(f => !f.properties._vonal || aktivNevek.has(f.properties._vonal));
    loadGeoJSON({ type: 'FeatureCollection', features: szurt });
  }

  async function betoltesIndul() {
    console.log('[DIAG] betoltesIndul meghívva');
    const letoltendok = VONALAK.filter(v => v.aktiv && !letoltottVonalak.has(v.nev));
    if (letoltendok.length === 0) {
      alkalmazSzurokEsRajzol();
      statusEl.textContent = 'Nincs új letöltendő vonal — válaszd ki a kívánt vonalakat, majd nyomd meg az "Adatok letöltése" gombot.';
      statusEl.style.color = '#555';
      return;
    }

    statusEl.style.color = '';
    statusEl.textContent = `Élő adat lekérése: ${letoltendok.map(v => v.nev).join(', ')}...`;
    const eredmenyek = await Promise.allSettled(
      letoltendok.map(line => fetchOverpassWithFallback(buildOverpassQueryForLine(line))
        .then(data => overpassToGeoJSON(data, line.nev)))
    );

    const sikeres = [];
    const sikertelenVonalak = [];
    eredmenyek.forEach((eredmeny, i) => {
      if (eredmeny.status === 'fulfilled') {
        sikeres.push(...eredmeny.value);
        letoltottVonalak.add(letoltendok[i].nev);
      } else {
        sikertelenVonalak.push(letoltendok[i].nev);
        console.warn('Vonal betöltése sikertelen:', letoltendok[i].nev, eredmeny.reason);
      }
    });

    if (sikeres.length === 0 && sikertelenVonalak.length > 0) {
      // Egyetlen vonal sem jött be élőben — helyi fájlra esünk vissza.
      console.warn('Egyik vonal sem tölthető be élőben, helyi fájlra váltás.');
      try {
        const geojson = await loadLocalSnapshot();
        osszesFeature = featureekOsszefesulese(osszesFeature, geojson.features);
        alkalmazSzurokEsRajzol();
        statusEl.textContent += ' (helyi mentett adat — nem feltétlenül friss!)';
        statusEl.style.color = '#b36b00';
      } catch (err2) {
        statusEl.textContent = 'Sem élő adat, sem helyi fájl nem elérhető: ' + err2.message;
        statusEl.style.color = 'red';
      }
      return;
    }

    osszesFeature = featureekOsszefesulese(osszesFeature, sikeres);
    alkalmazSzurokEsRajzol();
    statusEl.textContent += sikertelenVonalak.length > 0
      ? ` (élő adat — de nem sikerült: ${sikertelenVonalak.join(', ')})`
      : ' (élő adat)';
    if (sikertelenVonalak.length > 0) statusEl.style.color = '#b36b00';

    // Sikeres élő betöltés után felkínáljuk, hogy ez legyen az új helyi mentés is —
    // a böngésző biztonsági okból nem írhat csendben a lemezre, ezért ez egy
    // egykattintásos letöltés, amit utána a repóba kell másolni.
    const saveBtn = document.getElementById('saveSnapshotBtn');
    saveBtn.style.display = 'block';
    saveBtn.onclick = () => {
      const geojson = { type: 'FeatureCollection', features: osszesFeature };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: 'application/geo+json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'adatok.geojson';
      a.click();
      URL.revokeObjectURL(url);
    };
  }

  // --- Megjelenített vonalak panel: pipálható lista, változtatáskor újratölti az adatot ---
  // Bejelentkezett OSM-felhasználónak (osmSzerkesztesEngedelyezve) minden vonal mellett
  // megjelenik egy "Overpass lekérdezés" gomb is -- ez egy RITKA, kézzel indított,
  // INSERT-ONLY regisztrációs művelet (lásd vonalRegisztracioIndul), nem a rendszeres
  // adatforrás. Sima (nem bejelentkezett) felhasználó ezt egyáltalán nem látja.
  const vonalListaEl = document.getElementById('vonalLista');

  // Egy vonalnak van-e már mentett adata -- csak akkor ad választ, ha a vonal sajat_adatok
  // fájlját már megpróbáltuk betölteni (lásd osszesVonalAdatAllapotBetoltese), különben
  // null-t ad vissza ("még nem tudjuk"), hogy ne jelezzünk tévesen "nincs adat"-ot.
  function vonalVanEAdat(vonal) {
    if (!betoltottSajatVonalak.has(vonalKodja(vonal))) return null;
    for (const rekord of sajatAdatokTerkep.values()) {
      if (rekord._vonal === vonal.nev) return true;
    }
    return false;
  }

  function vonalListaKirajzolas() {
    vonalListaEl.innerHTML = `
      <div style="margin-bottom:6px; color:#555;">Üzemeltető: <strong>${escapeHtml(UZEMELTETO)}</strong> (a vonalak.json-ban módosítható)</div>
      ` + VONALAK.map((v, i) => {
        const vanAdat = vonalVanEAdat(v);
        const jelzes = vanAdat === false
          ? '<span style="color:#b36b00; font-size:12px;" title="Ezen a vonalon még nincs regisztrált oszlop">⚠ még nincs adat</span>'
          : '';
        const overpassGomb = osmSzerkesztesEngedelyezve
          ? `<button data-vonal-regisztracio="${i}" style="font-size:11px; padding:2px 6px; margin-left:6px; border:1px solid #ccc; border-radius:4px; background:#f7f7f7; cursor:pointer;">Overpass lekérdezés</button>`
          : '';
        return `
      <div style="margin-bottom:2px;">
        <label style="white-space:nowrap;">
          <input type="checkbox" data-vonal-index="${i}" ${v.aktiv ? 'checked' : ''} />
          ${escapeHtml(v.nev)}
        </label>
        ${jelzes}${overpassGomb}
      </div>`;
      }).join('');

    vonalListaEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.addEventListener('change', (ev) => {
        const idx = Number(ev.target.dataset.vonalIndex);
        const vonal = VONALAK[idx];
        vonal.aktiv = ev.target.checked;
        if (VONALAK.every(v => !v.aktiv)) {
          statusEl.textContent = 'Legalább egy vonalat aktívnak kell hagyni.';
          statusEl.style.color = 'red';
          ev.target.checked = true;
          vonal.aktiv = true;
          return;
        }
        if (vonal.aktiv && !betoltottSajatVonalak.has(vonalKodja(vonal))) {
          // Most bepipált, még be nem töltött vonal -- betöltjük a sajat_adatok fájlját
          // (cache-ből vagy hálózatról), mielőtt szűrünk/rajzolunk.
          vonalSajatAdatBetoltese(vonal).then(() => {
            osszesFeature = featureekOsszefesulese(osszesFeature, sajatAdatokFeatureKent());
            alkalmazSzurokEsRajzol();
          });
        } else {
          alkalmazSzurokEsRajzol(); // csak szűrés a már betöltött adaton, nincs új hálózati kérés
        }
      });
    });

    vonalListaEl.querySelectorAll('button[data-vonal-regisztracio]').forEach(btn => {
      btn.addEventListener('click', () => {
        const idx = Number(btn.dataset.vonalRegisztracio);
        vonalRegisztracioIndul(VONALAK[idx], btn);
      });
    });
  }

  // Induláskor (csak bejelentkezett állapotban) minden vonal sajat_adatok fájlját megnézi --
  // NEM csak az aktívakat -- hogy a panelen látszódjon, melyik vonalon nincs még regisztrált
  // adat ("⚠ még nincs adat"). Ez pusztán tájékoztató célú, nem tölt be semmit a térképre a
  // nem aktív vonalakról (a szűrés továbbra is csak az aktív vonalakat rajzolja ki).
  async function osszesVonalAdatAllapotBetoltese() {
    if (!osmSzerkesztesEngedelyezve) return;
    await Promise.all(VONALAK.map(v => vonalSajatAdatBetoltese(v)));
    vonalListaKirajzolas();
  }

  // Egyetlen vonal Overpass-regisztrációja: lekéri az összes csomópontot a vonal
  // reláció-azonosítója alapján, és INSERT-ONLY módon (lásd github_mentes.js) beírja a
  // sajat_adatok/{kod}.ndjson fájlba azokat, amiknek _osm_id-ja MÉG NEM szerepel benne.
  // A meglévő, már felmért/szerkesztett rekordokat egyáltalán nem érinti.
  async function vonalRegisztracioIndul(vonal, gombEl) {
    if (typeof githubMentes === 'undefined' || !githubMentes.tokenVan()) {
      alert('Az Overpass-regisztrációhoz be kell állítani a GitHub tokent -- nyiss meg egy oszlopot Szerkesztésre, ott az adatlapon található a token-beállítás.');
      return;
    }
    const eredetiSzoveg = gombEl.textContent;
    gombEl.disabled = true;
    gombEl.textContent = 'Lekérdezés...';
    statusEl.style.color = '';
    statusEl.textContent = `Overpass-regisztráció indul: ${vonal.nev}...`;

    try {
      // Előbb biztosan betöltjük a vonal jelenlegi sajat_adatok tartalmát, hogy pontosan
      // tudjuk, mely _osm_id-k szerepelnek már benne (insert-only döntéshez).
      await vonalSajatAdatBetoltese(vonal);

      const data = await fetchOverpassWithFallback(buildOverpassQueryForLine(vonal));
      const csomopontok = data.elements.filter(el => el.type === 'node');

      const kod = vonalKodja(vonal);
      const ujRekordok = csomopontok
        .filter(node => !sajatAdatokTerkep.has(String(node.id)))
        .map(node => ({
          szam: (node.tags && node.tags.ref) ? node.tags.ref : String(node.id),
          _osm_id: node.id,
          lat: node.lat,
          lon: node.lon,
          osm_tagek: node.tags || {},
          _vonal: vonal.nev,
          tartoszerkezetek: []
        }));

      if (ujRekordok.length === 0) {
        statusEl.textContent = `Overpass-regisztráció (${vonal.nev}): nincs új oszlop, minden csomópont már szerepel.`;
        statusEl.style.color = '#555';
        return;
      }

      statusEl.textContent = `Overpass-regisztráció (${vonal.nev}): ${ujRekordok.length} új oszlop mentése GitHub-ra...`;
      const eredmeny = await githubMentes.ujRekordokKotegeltMentese(ujRekordok, kod);

      // Helyi állapot (memória + cache) frissítése, hogy a térkép azonnal, hálózati
      // újratöltés nélkül mutassa az új oszlopokat.
      ujRekordok.forEach(r => sajatAdatokTerkep.set(String(r._osm_id), r));
      const vonalOsszesRekordja = [];
      sajatAdatokTerkep.forEach(r => { if (r._vonal === vonal.nev) vonalOsszesRekordja.push(JSON.stringify(r)); });
      ndjsonCacheIrasa(kod, vonalOsszesRekordja.join('\n') + '\n');

      osszesFeature = featureekOsszefesulese(osszesFeature, sajatAdatokFeatureKent());
      alkalmazSzurokEsRajzol();

      statusEl.textContent = `Overpass-regisztráció (${vonal.nev}) kész: ${eredmeny.ujSorokSzama} új oszlop mentve.`;
      statusEl.style.color = '#2a7d2a';
      vonalListaKirajzolas(); // a "⚠ még nincs adat" jelzés eltűnjön, ha ez volt az első regisztráció
    } catch (err) {
      console.warn('Overpass-regisztráció sikertelen:', vonal.nev, err);
      statusEl.textContent = `Overpass-regisztráció sikertelen (${vonal.nev}): ${err.message}`;
      statusEl.style.color = 'red';
    } finally {
      gombEl.disabled = false;
      gombEl.textContent = eredetiSzoveg;
    }
  }

  // --- Kötegelt feltöltés -- 4. lépés, offline-first átalakítás ---
  //
  // A "Változások feltöltése" gomb: a pending_valtozasok (localStorage) tartalmát vonalKod
  // szerint csoportosítva, vonalanként külön kötegelt GitHub-commitban tölti fel (egy commit
  // csak egy fájlt érinthet, ezért ahány vonalon van mentetlen módosítás, annyi külön
  // PUT-hívás történik). Részleges hiba esetén a sikertelen vonal(ak) tételei a
  // pending-listában maradnak, a sikeresek törlődnek -- semmi nem veszhet el.
  async function feltoltesIndul() {
    const feltoltesBtnEl = document.getElementById('feltoltesBtn');
    if (typeof githubMentes === 'undefined' || !githubMentes.tokenVan()) {
      alert('A feltöltéshez be kell állítani a GitHub tokent -- nyiss meg egy oszlopot Szerkesztésre, ott az adatlapon található a token-beállítás.');
      return;
    }
    const pending = githubMentes.pendingOlvasas();
    const osmIdk = Object.keys(pending);
    if (osmIdk.length === 0) return;

    // Csoportosítás vonalKod szerint.
    const vonalankent = new Map(); // vonalKod -> [{ osmId, rekord }, ...]
    osmIdk.forEach(osmId => {
      const p = pending[osmId];
      if (!vonalankent.has(p.vonalKod)) vonalankent.set(p.vonalKod, []);
      vonalankent.get(p.vonalKod).push({ osmId, rekord: p.rekord });
    });

    const eredetiSzoveg = feltoltesBtnEl.textContent;
    feltoltesBtnEl.disabled = true;
    statusEl.style.color = '';

    const sikeresVonalak = [];
    const sikertelenVonalak = []; // { vonalKod, hiba }

    for (const [vonalKod, tetelek] of vonalankent) {
      feltoltesBtnEl.textContent = `Feltöltés (${vonalKod})...`;
      statusEl.textContent = `Változások feltöltése: ${vonalKod} (${tetelek.length} oszlop)...`;
      try {
        await githubMentes.pendingFeltoltesVonalra(vonalKod, tetelek);

        // Sikeres feltöltés után törli a pending-listából az adott vonal tételeit, és
        // frissíti a helyi (memória + cache) állapotot, hogy a térkép azonnal a feltöltött
        // tartalmat mutassa, ne a régi GitHub-cache-t.
        tetelek.forEach(({ osmId, rekord }) => {
          githubMentes.pendingTorles(osmId);
          sajatAdatokTerkep.set(String(osmId), rekord);
        });
        const vonal = VONALAK.find(v => vonalKodja(v) === vonalKod);
        if (vonal) {
          const vonalOsszesRekordja = [];
          sajatAdatokTerkep.forEach(r => { if (r._vonal === vonal.nev) vonalOsszesRekordja.push(JSON.stringify(r)); });
          ndjsonCacheIrasa(vonalKod, vonalOsszesRekordja.join('\n') + '\n');
        }

        sikeresVonalak.push(vonalKod);
      } catch (err) {
        console.warn('Kötegelt feltöltés sikertelen:', vonalKod, err);
        sikertelenVonalak.push({ vonalKod, hiba: err.message });
        // A pending-lista ezen vonalhoz tartozó tételei ÉRINTETLENÜL maradnak -- semmi nem
        // veszhet el egy sikertelen feltöltés miatt.
      }
    }

    osszesFeature = featureekOsszefesulese(osszesFeature, sajatAdatokFeatureKent());
    alkalmazSzurokEsRajzol(); // ez automatikusan frissíti a pendingSzamlalot is

    feltoltesBtnEl.disabled = false;
    feltoltesBtnEl.textContent = eredetiSzoveg;

    if (sikertelenVonalak.length === 0) {
      statusEl.textContent = `Változások feltöltve: ${sikeresVonalak.join(', ')}.`;
      statusEl.style.color = '#2a7d2a';
    } else {
      const hibaLista = sikertelenVonalak.map(s => `${s.vonalKod}: ${s.hiba}`).join('; ');
      statusEl.textContent = (sikeresVonalak.length > 0 ? `Feltöltve: ${sikeresVonalak.join(', ')}. ` : '') +
        `Sikertelen (a mentetlen módosítás megmaradt): ${hibaLista}`;
      statusEl.style.color = 'red';
    }
  }

  const feltoltesGombEl = document.getElementById('feltoltesBtn');
  if (feltoltesGombEl) feltoltesGombEl.addEventListener('click', feltoltesIndul);

  // Induláskor: előbb a vonalak.json betöltése, utána az adatlekérés.
  // Ha a fájl nem érhető el (pl. hiányzik, vagy hibás JSON), a beépített
  // alapértelmezett VONALAK-kal folytatjuk, csak jelezzük a státuszsávban.
  async function inditas() {
    console.log('[DIAG] inditas() elindult');
    try {
      const res = await fetch('./vonalak.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const config = await res.json();
      UZEMELTETO = config.uzemelteto;
      VONALAK = config.vonalak;
    } catch (err) {
      console.warn('vonalak.json nem tölthető be, beépített alapértelmezés marad:', err);
      statusEl.textContent = 'Figyelmeztetés: vonalak.json nem tölthető be, beépített alapértelmezéssel indul.';
    }
    vonalListaKirajzolas();

    // A mentett saját adatok az elsődleges forrás — ezekből azonnal rajzolunk, még mielőtt
    // bármilyen hálózati (Overpass) kérés elindulna. Az "Adatok letöltése" gombra ezt majd
    // csak frissíti/kiegészíti a friss OSM-adat, nem írja felül.
    await sajatAdatokBetoltese();
    if (sajatAdatokTerkep.size > 0) {
      osszesFeature = sajatAdatokFeatureKent();
      alkalmazSzurokEsRajzol();
      statusEl.textContent = `${sajatAdatokTerkep.size} mentett oszlop betöltve. Válaszd ki a vonalakat, majd "Adatok letöltése" a frissítéshez.`;
    }
    console.log('[DIAG] inditas() befejeződött');
  }
  inditas();

  document.getElementById('adatokLetoltesBtn').addEventListener('click', betoltesIndul);

  osmAuth.visszaterasFeldolgozasa().then(() => osmBejelentkezesAllapotFrissit());

  // Kézi felülbírálás — bármikor használható, függetlenül attól, hogy az élő adat
  // "sikeresnek" tűnt-e (pl. ha egy Overpass-tükör hibás/hiányos, de HTTP 200-at ad vissza).
  document.getElementById('manualFileInput').addEventListener('change', (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    statusEl.textContent = 'Kézi fájl beolvasása...';
    statusEl.style.color = '';
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const geojson = JSON.parse(e.target.result);
        osszesFeature = geojson.features;
        alkalmazSzurokEsRajzol();
        statusEl.textContent += ' (kézi fájlból)';
        statusEl.style.color = '#b36b00';
      } catch (err) {
        statusEl.textContent = 'Hiba a fájl feldolgozásakor: ' + err.message;
        statusEl.style.color = 'red';
      }
    };
    reader.readAsText(file);
  });

  // Ne engedje véletlenül elhagyni az oldalt, ha van még fel nem töltött (helyi) módosítás.
  window.addEventListener('beforeunload', (ev) => {
    if (typeof githubMentes === 'undefined') return;
    if (githubMentes.pendingDarab() > 0) {
      ev.preventDefault();
      ev.returnValue = '';
    }
  });

  // Cross-tab frissítés: mivel az adatlap külön böngészőfülön/ablakban nyílik, a
  // localStorage-írás a storage eseményen keresztül automatikusan értesíti ezt a (térkép-)
  // fület, ha az nyitva marad háttérben, amíg az adatlapon Mentés történik.
  window.addEventListener('storage', (ev) => {
    if (ev.key === 'pending_valtozasok') {
      osszesFeature = featureekOsszefesulese(osszesFeature, sajatAdatokFeatureKent());
