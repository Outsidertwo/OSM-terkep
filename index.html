<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>MÁV Vasúti Kataszter és GPS Térkép</title>
    
    <!-- Leaflet térképmotor CSS és JS -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>

    <style>
        /* Ez a rész kényszeríti ki a teljes képernyős megjelenítést mobilon és PC-n is */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background-color: #222; /* Sötét háttér, amíg a műholdkép betölt */
        }
        /* GPS célkereszt gomb stílusa */
        .gps-button {
            position: absolute;
            bottom: 30px;
            right: 20px;
            z-index: 1000;
            background: white;
            padding: 12px;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            font-size: 24px;
            width: 30px;
            height: 30px;
            text-align: center;
            line-height: 30px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="gps-button" onclick="locateUser()">🎯</div>

    <script>
        // 1. Térkép elindítása (Magyarország közepére állítva, tágabb nézettel)
        const map = L.map('map').setView([47.162, 19.503], 7);

        // 2. Alaptérkép rétegek (Műholdas és Normál utcatérkép)
        const osmStandard = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        });

        const googleSatellite = L.tileLayer('https://google.com{x}&y={y}&z={z}', {
            attribution: '© Google Maps'
        });

        // Alapértelmezetten a műholdas kép indul el
        googleSatellite.addTo(map);

        const baseMaps = {
            "Műholdas (Google)": googleSatellite,
            "Alaptérkép (OSM)": osmStandard
        };
        // Kapcsológomb elhelyezése
        L.control.layers(baseMaps, null, {position: 'topright'}).addTo(map);

        // 3. Konfigurációs fájl ellenőrzése
        fetch('konfiguracio.json')
            .then(response => response.json())
            .then(config => {
                console.log("MÁV Konfiguráció sikeresen beolvasva:", config);
            })
            .catch(err => console.error("Hiba a konfiguráció betöltésekor:", err));

        // 4. GPS Helymeghatározás kezelése
        let userLocationMarker = null;

        function locateUser() {
            map.locate({setView: true, maxZoom: 18});
        }

        map.on('locationfound', function(e) {
            if (userLocationMarker) map.removeLayer(userLocationMarker);
            userLocationMarker = L.circle(e.latlng, {radius: e.accuracy, color: '#007bff', fillColor: '#007bff', fillOpacity: 0.15}).addTo(map);
            L.popup().setLatLng(e.latlng).setContent("Itt vagy most a pályán!").openOn(map);
        });

        map.on('locationerror', function() {
            alert("A GPS koordináták lekérése sikertelen. Kérlek, engedélyezd a helymeghatározást!");
        });
    </script>
</body>
</html>
